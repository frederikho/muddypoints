<text x="90" y="150" font-size="68" font-weight="800" fill="#1c2330">Confidence intervals</text>
<text x="90" y="290" font-size="60" font-style="italic" font-family="Georgia, 'Times New Roman', serif" fill="#1c2330">x̄ ± t* · s / √n</text><circle cx="100" cy="407" r="8" fill="#4f46e5"/><text x="130" y="420" font-size="34" fill="#1c2330">95 % interval: it catches μ in 95 % of repeated samples</text><circle cx="100" cy="491" r="8" fill="#4f46e5"/><text x="130" y="504" font-size="34" fill="#1c2330">It is not: “95 % probability that μ is in this interval”</text><circle cx="100" cy="575" r="8" fill="#4f46e5"/><text x="130" y="588" font-size="34" fill="#1c2330">Wider interval → more confidence, less precision</text><line x1="1415.0" y1="320" x2="1415.0" y2="740" stroke="#12805c" stroke-width="4" stroke-dasharray="10 8"/><text x="1415.0" y="300" font-size="26" fill="#12805c" text-anchor="middle">true mean μ</text><line x1="1350.0" y1="360" x2="1493.0" y2="360" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/><circle cx="1421.5" cy="360" r="9" fill="#4f46e5"/><line x1="1317.5" y1="408" x2="1467.0" y2="408" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/><circle cx="1392.25" cy="408" r="9" fill="#4f46e5"/><line x1="1389.0" y1="456" x2="1545.0" y2="456" stroke="#d92d20" stroke-width="8" stroke-linecap="round"/><circle cx="1467.0" cy="456" r="9" fill="#d92d20"/><line x1="1285.0" y1="504" x2="1434.5" y2="504" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/><circle cx="1359.75" cy="504" r="9" fill="#4f46e5"/><line x1="1337.0" y1="552" x2="1480.0" y2="552" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/><circle cx="1408.5" cy="552" r="9" fill="#4f46e5"/><line x1="1363.0" y1="600" x2="1519.0" y2="600" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/><circle cx="1441.0" cy="600" r="9" fill="#4f46e5"/><line x1="1246.0" y1="648" x2="1389.0" y2="648" stroke="#d92d20" stroke-width="8" stroke-linecap="round"/><circle cx="1317.5" cy="648" r="9" fill="#d92d20"/><line x1="1330.5" y1="696" x2="1473.5" y2="696" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/><circle cx="1402.0" cy="696" r="9" fill="#4f46e5"/><text x="1330" y="800" font-size="26" fill="#667085" text-anchor="middle">8 samples, 2 intervals miss μ (red)</text>
