<text x="90" y="150" font-size="68" font-weight="800" fill="#1c2330">Standard error &amp; the CLT</text>
<text x="90" y="290" font-size="64" font-style="italic" font-family="Georgia, 'Times New Roman', serif" fill="#1c2330">SE = s / √n</text><circle cx="100" cy="407" r="8" fill="#4f46e5"/><text x="130" y="420" font-size="36" fill="#1c2330">Standard error: spread of the sample mean</text><circle cx="100" cy="477" r="8" fill="#4f46e5"/><text x="130" y="490" font-size="36" fill="#1c2330">Bigger samples → smaller SE</text><circle cx="100" cy="547" r="8" fill="#4f46e5"/><text x="130" y="560" font-size="36" fill="#1c2330">Central Limit Theorem: x̄ is roughly normal for large n</text><rect x="1040" y="698" width="32" height="22" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1076" y="675" width="32" height="45" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1112" y="638" width="32" height="82" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1148" y="584" width="32" height="136" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1184" y="520" width="32" height="200" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1220" y="456" width="32" height="264" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1256" y="408" width="32" height="312" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1292" y="390" width="32" height="330" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1328" y="408" width="32" height="312" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1364" y="456" width="32" height="264" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1400" y="520" width="32" height="200" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1436" y="584" width="32" height="136" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1472" y="638" width="32" height="82" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1508" y="675" width="32" height="45" fill="#4f46e5" opacity=".8" rx="4"/><rect x="1544" y="698" width="32" height="22" fill="#4f46e5" opacity=".8" rx="4"/><line x1="1020" y1="720" x2="1580" y2="720" stroke="#667085" stroke-width="3"/><text x="1300" y="770" font-size="26" fill="#667085" text-anchor="middle">distribution of x̄ over many samples</text>
