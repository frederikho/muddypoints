<text x="90" y="150" font-size="68" font-weight="800" fill="#1c2330">Sample variance</text>
<text x="90" y="290" font-size="64" font-style="italic" font-family="Georgia, 'Times New Roman', serif" fill="#1c2330">s² = Σ (xᵢ − x̄)² / (n − 1)</text><circle cx="100" cy="407" r="8" fill="#4f46e5"/><text x="130" y="420" font-size="36" fill="#1c2330">x̄ is the sample mean</text><circle cx="100" cy="471" r="8" fill="#4f46e5"/><text x="130" y="484" font-size="36" fill="#1c2330">Divide by n − 1, not n (Bessel’s correction)</text><circle cx="100" cy="535" r="8" fill="#4f46e5"/><text x="130" y="548" font-size="36" fill="#1c2330">s = √s² is in the same unit as the data</text><line x1="900" y1="700" x2="1476" y2="700" stroke="#667085" stroke-width="3"/><line x1="1028" y1="640" x2="1210" y2="640" stroke="#e07a1f" stroke-width="3" stroke-dasharray="6 6"/><line x1="1092" y1="640" x2="1210" y2="640" stroke="#e07a1f" stroke-width="3" stroke-dasharray="6 6"/><line x1="1124" y1="640" x2="1210" y2="640" stroke="#e07a1f" stroke-width="3" stroke-dasharray="6 6"/><line x1="1140" y1="640" x2="1210" y2="640" stroke="#e07a1f" stroke-width="3" stroke-dasharray="6 6"/><line x1="1188" y1="640" x2="1210" y2="640" stroke="#e07a1f" stroke-width="3" stroke-dasharray="6 6"/><line x1="1220" y1="640" x2="1210" y2="640" stroke="#e07a1f" stroke-width="3" stroke-dasharray="6 6"/><line x1="1268" y1="640" x2="1210" y2="640" stroke="#e07a1f" stroke-width="3" stroke-dasharray="6 6"/><line x1="1284" y1="640" x2="1210" y2="640" stroke="#e07a1f" stroke-width="3" stroke-dasharray="6 6"/><line x1="1348" y1="640" x2="1210" y2="640" stroke="#e07a1f" stroke-width="3" stroke-dasharray="6 6"/><line x1="1412" y1="640" x2="1210" y2="640" stroke="#e07a1f" stroke-width="3" stroke-dasharray="6 6"/><circle cx="1028" cy="640" r="14" fill="#4f46e5" opacity=".85"/><circle cx="1092" cy="640" r="14" fill="#4f46e5" opacity=".85"/><circle cx="1124" cy="640" r="14" fill="#4f46e5" opacity=".85"/><circle cx="1140" cy="640" r="14" fill="#4f46e5" opacity=".85"/><circle cx="1188" cy="640" r="14" fill="#4f46e5" opacity=".85"/><circle cx="1220" cy="640" r="14" fill="#4f46e5" opacity=".85"/><circle cx="1268" cy="640" r="14" fill="#4f46e5" opacity=".85"/><circle cx="1284" cy="640" r="14" fill="#4f46e5" opacity=".85"/><circle cx="1348" cy="640" r="14" fill="#4f46e5" opacity=".85"/><circle cx="1412" cy="640" r="14" fill="#4f46e5" opacity=".85"/><line x1="1210" y1="590" x2="1210" y2="700" stroke="#e07a1f" stroke-width="5"/><text x="1210" y="570" font-size="30" fill="#e07a1f" text-anchor="middle" font-style="italic" font-family="Georgia, 'Times New Roman', serif">x̄</text><text x="900" y="760" font-size="26" fill="#667085">Distances to the mean, squared and summed</text>
<text x="90" y="858" font-size="24" fill="#667085">Statistics I · Lecture 4</text>
