<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board · Muddy Points</title>
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#4f46e5">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/board.js"></script>
</head>
<body>
  <header class="topbar">
    <a id="staff-link" class="small hidden" href="./">← Dashboard</a>
    <a href="./" class="brand" title="Muddy Points"><img class="logo" src="img/logo.png" alt="" width="28" height="28"></a>
    <strong id="board-title" class="brand">Loading…</strong>
    <span id="locked" class="badge locked hidden">comments closed</span>
    <span class="spacer"></span>
    <span id="who"></span>
    <button id="settings-btn" class="cog hidden" type="button" title="Board settings" aria-label="Board settings" aria-controls="panel" aria-expanded="false">⚙</button>
  </header>
  <main class="container">
    <div id="slides"></div>
  </main>
  <div id="panel-backdrop" class="panel-backdrop hidden"></div>
  <aside id="panel" class="side-panel" aria-label="Board settings" aria-hidden="true"></aside>
</body>
</html>
