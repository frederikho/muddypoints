<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload files · Muddy Points</title>
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/drop.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><img class="logo" src="img/logo.png" alt="" width="28" height="28"> Muddy Points</a>
  </header>
  <main class="container" style="max-width:720px">
    <div id="intro"><p class="muted">Loading…</p></div>
    <label id="dropzone" class="dropzone hidden" for="file-input">
      <input id="file-input" type="file" accept="application/pdf,.pdf" multiple class="hidden">
      <div class="dropzone-icon">📄</div>
      <strong>Drag your PDFs here</strong>
      <span class="muted small">or click to choose files · several at once is fine</span>
    </label>
    <ul id="file-list" class="file-list"></ul>
    <div id="summary"></div>
  </main>
  <footer class="site-footer"><a href="#" data-feedback>💡 Feedback or feature idea</a></footer>
</body>
</html>
