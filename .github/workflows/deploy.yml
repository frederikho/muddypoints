# Test -> deploy backend (SAM) -> deploy frontend (GitHub Pages) -> tag the release.
# Runs on every push to main. Pull requests only run the tests.
# Manual run (Actions tab -> "Run workflow") can deploy any older ref = emergency rollback, see CLAUDE.md.
name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (tag like deploy-20260101-120000, or commit SHA). Empty = current main."
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest
        working-directory: backend

  deploy-backend:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    outputs:
      api_url: ${{ steps.outputs.outputs.api_url }}
    env:
      STACK_NAME: ${{ vars.STACK_NAME || 'muddypoints' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: aws-actions/setup-sam@v2
        with: { use-installer: true }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Compute frontend URL
        id: frontend
        run: |
          url="${{ vars.FRONTEND_URL }}"
          owner="${{ github.repository_owner }}"
          [ -n "$url" ] || url="https://${owner,,}.github.io/${{ github.event.repository.name }}"
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
      - run: sam build
      - name: sam deploy
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
          SUPERADMIN_EMAILS: ${{ secrets.SUPERADMIN_EMAILS }}
          FRONTEND_URL: ${{ steps.frontend.outputs.url }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          ALLOWED_EMAIL_DOMAINS: ${{ vars.ALLOWED_EMAIL_DOMAINS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
        run: |
          # SAM rejects empty values ("Key="), so only pass parameters that are set.
          params=("SecretKey=$SECRET_KEY" "FrontendUrl=$FRONTEND_URL" "LogLevel=$LOG_LEVEL")
          [ -n "$MAIL_FROM" ] && params+=("MailFrom=$MAIL_FROM")
          [ -n "$BREVO_API_KEY" ] && params+=("BrevoApiKey=$BREVO_API_KEY")
          [ -n "$FEEDBACK_EMAIL" ] && params+=("FeedbackEmail=$FEEDBACK_EMAIL")
          [ -n "$SUPERADMIN_EMAILS" ] && params+=("SuperadminEmails=$SUPERADMIN_EMAILS")
          [ -n "$ALLOWED_EMAIL_DOMAINS" ] && params+=("AllowedEmailDomains=$ALLOWED_EMAIL_DOMAINS")
          sam deploy --stack-name "$STACK_NAME" --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides "${params[@]}"
      - name: Read stack outputs
        id: outputs
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "api_url=${url%/}" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "${{ steps.outputs.outputs.api_url }}/api/health"

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write, contents: read }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - name: Point the frontend at the API
        run: |
          printf 'window.MUDDYPOINTS_CONFIG = { apiBase: "%s" };\n' "${{ needs.deploy-backend.outputs.api_url }}" > frontend/js/config.js
          cat frontend/js/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend }
      - uses: actions/deploy-pages@v4
        id: deployment

  tag-release:
    needs: deploy-frontend
    if: github.event_name == 'push' || inputs.ref == ''
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Tag successful deployment (rollback points)
        run: |
          tag="deploy-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$tag" "${{ github.sha }}"
          git push origin "$tag"
          echo "Tagged $tag" >> "$GITHUB_STEP_SUMMARY"
